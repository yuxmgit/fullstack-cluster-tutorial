# ============================================================
#  Redis 配置（教学版：单实例 + 持久化 + 内存淘汰）
#  生产高可用方案（主从+哨兵 / Cluster）见 docs/05-Redis详解.md
# ============================================================

bind 0.0.0.0
port 6379
protected-mode yes

# 密码：生产必须设，且不要提交到公开仓库
requirepass redispass

# ---------- 内存 ----------
maxmemory 256mb
# 内存满时的淘汰策略。
# Session 专用实例推荐 allkeys-lru：所有 key 都是可再生的（用户重新登录即可）。
# 千万别和「消息队列 / 重要缓存」混在一个实例里，否则可能把关键数据淘汰掉。
maxmemory-policy allkeys-lru

# ---------- 持久化 ----------
# AOF：每条写命令追加日志，最多丢 1 秒数据
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir /data

# RDB 快照（作为 AOF 的补充备份）
save 900 1
save 300 10
save 60 10000

# ---------- 日志 ----------
loglevel notice

# 教学环境：允许 MONITOR 观察命令（生产会带来性能开销，慎用）
# redis-cli MONITOR 即可使用
