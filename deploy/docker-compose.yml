# ============================================================
#  方式 B：完整集群版
#
#    docker compose -f deploy/docker-compose.yml up -d --build
#    浏览器打开 http://localhost:8080
#
#  拓扑：
#    lb ──┬─ frontend            静态页面
#         └─ backend-1/2/3      轮询，三个完全相同的副本
#                ├─ redis        集中式 Session + 启动锁 + 全局计数
#                ├─ mysql-master 写
#                └─ mysql-slave  读（binlog/GTID 自动同步）
#
#  实验开关（教程 02 章）：
#    $env:SESSION_BACKEND = "memory"   → 复现「集群掉登录」
#    Remove-Item Env:SESSION_BACKEND   → 切回 Redis，问题消失
# ============================================================

name: fullstack-cluster

# ---------- 3 个后端副本共享的配置（YAML 锚点，改一处全生效）----------
x-backend-common: &backend-common
  build:
    context: ../backend
  image: fullstack-cluster-backend:latest
  restart: unless-stopped
  environment: &backend-env
    DB_WRITE_URL: mysql+pymysql://demo:demo123@mysql-master:3306/fullstack_demo
    DB_READ_URL: mysql+pymysql://demo:demo123@mysql-slave:3306/fullstack_demo
    REDIS_URL: redis://:redispass@redis:6379/0
    # 宿主机环境变量可覆盖；不设则默认 redis
    SESSION_BACKEND: ${SESSION_BACKEND:-redis}
    SESSION_TTL_SECONDS: "1800"
    COOKIE_SECURE: "false"
    CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  depends_on:
    mysql-master:
      condition: service_healthy
    mysql-slave:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    # 只探本进程，不查数据库（否则依赖一抖，所有副本会被同时判死）
    test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/system/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 25s

services:
  # ---------------------- Redis：共享小黑板 ----------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports:
      - "6379:6379"          # 暴露出来方便你用 redis-cli 做实验
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------- MySQL 主库（只写）----------------------
  mysql-master:
    image: mysql:8.0
    hostname: mysql-master
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      # 关键：官方镜像默认只创建 root@'localhost'，
      # 不设这一项，replica-init 容器用 root 远程连接会被拒绝。
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: fullstack_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo123
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/master.cnf:/etc/mysql/conf.d/master.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-master-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ---------------------- MySQL 从库（只读）----------------------
  mysql-slave:
    image: mysql:8.0
    hostname: mysql-slave
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/slave.cnf:/etc/mysql/conf.d/slave.cnf:ro
      - mysql-slave-data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ---------------------- 一次性任务：配置主从复制 ----------------------
  replica-init:
    image: mysql:8.0
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MASTER_HOST: mysql-master
      SLAVE_HOST: mysql-slave
    volumes:
      - ./mysql/replica-init.sh:/init/replica-init.sh:ro
    # Windows 上写出的 .sh 可能是 CRLF，容器里会报 $'\r': command not found，
    # 所以先用 tr 去掉 \r 再执行。
    entrypoint: ["/bin/bash", "-c"]
    command: ["tr -d '\\r' < /init/replica-init.sh > /tmp/replica-init.sh && exec /bin/bash /tmp/replica-init.sh"]
    restart: "no"

  # ---------------------- 3 个后端副本 ----------------------
  backend-1:
    <<: *backend-common
    hostname: backend-1
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-1
    ports:
      # 只把 1 号副本暴露出来，方便你直接看接口文档 http://localhost:8001/docs
      # 真实流量仍然全部经过 lb，不会绕过负载均衡
      - "8001:8000"

  backend-2:
    <<: *backend-common
    hostname: backend-2
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-2

  backend-3:
    <<: *backend-common
    hostname: backend-3
    environment:
      <<: *backend-env
      INSTANCE_ID: backend-3

  # ---------------------- 前端静态资源 ----------------------
  frontend:
    build:
      context: ../frontend
    image: fullstack-cluster-frontend:latest
    restart: unless-stopped

  # ---------------------- 统一入口 + 负载均衡 ----------------------
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped

volumes:
  redis-data:
  mysql-master-data:
  mysql-slave-data:
