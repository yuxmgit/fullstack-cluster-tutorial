# ============================================================
#  统一入口 + 负载均衡
#
#  这个文件被挂载到 nginx 容器的 /etc/nginx/conf.d/default.conf，
#  因此以下内容处在 nginx 主配置的 http { } 上下文里。
#
#  核心思想：浏览器只看到 http://localhost:8080 这一个域名
#     /      → 前端静态资源容器
#     /api/  → 后端集群（轮询）
#  因为同源，所以浏览器不会触发任何跨域限制（教程 01 章）。
# ============================================================

upstream backend_pool {
    # 默认策略：round-robin 轮询，1 → 2 → 3 → 1 ...
    # 想改策略：
    #   least_conn;                     最少连接（请求耗时差异大时用）
    #   ip_hash;                        同一 IP 固定同一台（粘性会话，会掩盖问题）
    #   server backend-1:8000 weight=3;  加权
    server backend-1:8000 max_fails=3 fail_timeout=10s;
    server backend-2:8000 max_fails=3 fail_timeout=10s;
    server backend-3:8000 max_fails=3 fail_timeout=10s;

    # 与后端保持长连接，减少 TCP 握手开销
    keepalive 32;
}

# 自定义日志格式：把「这次请求最终落到哪台后端」记下来，排障时非常有用。
# 注意 log_format 只能在 http 上下文中定义（本文件被 include 进 http 块），
# 不能写进 server { } 里，否则 nginx 会直接启动失败。
log_format upstream_log '$remote_addr "$request" $status up=$upstream_addr rt=$request_time';

server {
    listen 80;
    server_name _;

    # 允许上传的最大请求体
    client_max_body_size 10m;

    access_log /var/log/nginx/access.log upstream_log;

    # ---------- API：转发给后端集群 ----------
    location /api/ {
        proxy_pass http://backend_pool;

        # 配合 upstream keepalive，必须用 HTTP/1.1 并清空 Connection 头
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 透传真实信息，否则后端看到的客户端 IP 永远是 Nginx 的
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时要短一些：后端挂了要快速失败并切换到其它副本
        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 失败时自动换下一台重试（幂等接口安全；非幂等接口慎用）
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # ---------- 静态页面：转发给前端容器 ----------
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
