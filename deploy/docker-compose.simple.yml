# ============================================================
#  方式 A：单机最小版（建议第一个跑）
#
#    docker compose -f deploy/docker-compose.simple.yml up -d --build
#    浏览器打开 http://localhost:8080
#
#  包含：Nginx + 前端 + 1 个后端 + 1 个 MySQL + 1 个 Redis
#  目的：先看到一个能跑的系统，再上完整集群。
# ============================================================

name: fullstack-simple

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - simple-redis-data:/data
    ports:
      - "6380:6379"          # 刻意错开 6379，避免和完整集群同时跑时冲突
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: fullstack_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo123
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - simple-mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ../backend
    image: fullstack-cluster-backend:latest
    hostname: backend-simple
    environment:
      # 单机版：读写都指向同一个库
      DB_WRITE_URL: mysql+pymysql://demo:demo123@mysql:3306/fullstack_demo
      DB_READ_URL: mysql+pymysql://demo:demo123@mysql:3306/fullstack_demo
      REDIS_URL: redis://:redispass@redis:6379/0
      SESSION_BACKEND: ${SESSION_BACKEND:-redis}
      SESSION_TTL_SECONDS: "1800"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      INSTANCE_ID: backend-simple
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/system/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../frontend
    image: fullstack-cluster-frontend:latest
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-lb-simple.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  simple-redis-data:
  simple-mysql-data:
