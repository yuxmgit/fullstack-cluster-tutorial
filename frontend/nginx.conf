# 前端容器内的 Nginx：只负责把 Vue 的静态文件吐出去。
# 注意：这里不做 /api 转发 —— 统一入口的转发在 deploy/nginx-lb.conf 里，
# 这样「前端容器」和「负载均衡」职责分离，前端可以单独换 CDN。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用（history 模式）必备：任何找不到的路径都回退到 index.html，
    # 否则刷新 /lab 会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
